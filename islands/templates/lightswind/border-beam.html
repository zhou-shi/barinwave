{{ $id := delimit (slice "lightswind-ui" (now.UnixNano)) "-" }}

<div id="{{ $id }}">
    <script>
        window.requestIslands = window.requestIslands || [];
        window.requestIslands.push({
            component: "BorderBeam",
            targetId: "{{ $id }}",
            dataId: null
        });
    </script>
</div>
